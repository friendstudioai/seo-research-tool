<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Generate License Keys</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #fff; border-radius: 16px; padding: 32px; box-shadow: 0 2px 16px rgba(0,0,0,.08); max-width: 520px; width: 100%; }
        .card h2 { font-size: 22px; color: #1a1a2e; margin-bottom: 4px; }
        .card p { font-size: 14px; color: #666; margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 4px; }
        select, input[type=text], input[type=password] { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 16px; font-family: inherit; }
        select:focus, input:focus { outline: none; border-color: #2F5496; }
        button { background: #2F5496; color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; }
        button:hover { background: #1e3c6e; }
        .result { margin-top: 16px; padding: 16px; border-radius: 8px; display: none; font-size: 14px; word-break: break-all; }
        .result.show { display: block; }
        .result.ok { background: #e8f5e9; color: #2d7d46; }
        .result.err { background: #fce4e4; color: #d32f2f; }
        .key-item { background: #f0f4ff; padding: 4px 8px; border-radius: 4px; display: inline-block; margin: 2px; font-family: monospace; font-size: 13px; }
        .back-link { display: block; text-align: center; margin-top: 16px; font-size: 13px; color: #666; }
    </style>
</head>
<body>
<div class="card">
    <h2>Generate License Key</h2>
    <p>Create a new license key for a customer</p>
    <form method="POST" action="/admin">
        <label for="plan">Plan</label>
        <select id="plan" name="plan">
            <option value="single">Single Report (24h) - $4.99</option>
            <option value="monthly" selected>Monthly (30 days) - $19</option>
            <option value="yearly">Yearly (365 days) - $149</option>
        </select>
        <label for="count">Quantity</label>
        <select id="count" name="count">
            <option value="1">1</option>
            <option value="5">5</option>
            <option value="10">10</option>
        </select>
        <label for="secret">Admin Secret</label>
        <input type="password" id="secret" name="secret" placeholder="Enter admin secret" required>
        <button type="submit">Generate Keys</button>
    </form>

    {% if error_msg %}
    <div class="result err show">{{ error_msg }}</div>
    {% endif %}

    {% if keys_result %}
    <div class="result ok show">
        <strong>Keys Generated:</strong><br><br>
        {% for key in keys_result.keys %}
        <span class="key-item">{{ key }}</span><br>
        {% endfor %}
        <br>
        <small>Expires: {{ keys_result.expires }}</small>
    </div>
    {% endif %}

    <a class="back-link" href="/">Back to tool</a>
</div>
</body>
</html>
